name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig"
        required: true
        default: "a22x_defconfig"
      anykernel_repo:
        description: "Repo AnyKernel3"
        required: true
        default: "https://github.com/naifi1954/AnyKernel3"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEFCONFIG: ${{ inputs.defconfig }}
      ANYKERNEL_REPO: ${{ inputs.anykernel_repo }}
      TZ: Asia/Jakarta
    steps:
    
      - name: Clean Up disk runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip xz-utils lz4 zstd python3 git curl wget \
            device-tree-compiler

      - name: Checkout Kernel Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: kernel
        
      - name: Clone toolchain
        run: |
          mkdir -p tc && cd tc

          git clone --depth=1 -b android11-release --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git -C clang sparse-checkout set clang-r383902

          clone_gcc() {
            git clone --depth=1 -b android11-release \
              "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/$1" "$3" \
            || git clone --depth=1 -b lineage-18.1 "https://github.com/LineageOS/$2" "$3"
          }
          clone_gcc aarch64/aarch64-linux-android-4.9 android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          clone_gcc arm/arm-linux-androideabi-4.9 android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

          test -d gcc64/bin && test -d gcc32/bin
          ls gcc64/bin | grep 'gcc$' || true

      - name: Build
        working-directory: kernel
        run: |
          TC="$GITHUB_WORKSPACE/tc"
          if [ -e "$TC/gcc64/bin/aarch64-linux-androidkernel-gcc" ]; then
            P64=aarch64-linux-androidkernel-
          else
            P64=aarch64-linux-android-
          fi
          export PATH="$TC/clang/clang-r383902/bin:$TC/gcc64/bin:$TC/gcc32/bin:$PATH"
          export ANDROID_MAJOR_VERSION=r
          export ARCH=arm64
          export KBUILD_BUILD_USER=rufnx
          export KBUILD_BUILD_HOST=github-actions
          MAKE_ARGS=(
            -C "$(pwd)" O="$(pwd)/out"
            CC="$TC/clang/clang-r383902/bin/clang"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE="$TC/gcc64/bin/$P64"
            CROSS_COMPILE_ARM32="$TC/gcc32/bin/arm-linux-androideabi-"
            KCFLAGS=-w
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )
          make "${MAKE_ARGS[@]}" "$DEFCONFIG"
          make -j"$(nproc)" "${MAKE_ARGS[@]}" 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel3
          rm -rf AnyKernel3/.git
          BOOT=kernel/out/arch/arm64/boot
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT/$f" ]; then cp "$BOOT/$f" AnyKernel3/; echo "pakai $f"; break; fi
          done
          cd AnyKernel3
          zip -r9 "../a22x-kernel-$(date +%Y%m%d-%H%M).zip" . -x '*.git*' README.md

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: a22x-kernel-*.zip

      - name: Upload Image.gz mentah
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: warn

      - name: Build Log
        if: failure()
        run : |
          if [ -f build.log ]; then
            grep "error" build.log
          f
